name: Build NationsBMSReader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Extract Android project
        run: |
          mkdir -p extracted

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún ZIP en la raíz."
            ls -la
            exit 1
          fi

          echo "Extrayendo: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d extracted

          SETTINGS="$(find extracted -type f -name settings.gradle -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: El ZIP no contiene settings.gradle."
            find extracted -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto encontrado en: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NationsBMSReader-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
