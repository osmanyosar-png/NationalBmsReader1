name: Build NationsBMSReader APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        run: |
          echo "Repository files:"
          find . -maxdepth 4 -type f | sort | head -250
          echo "Searching for Gradle wrapper:"
          find . -type f -name gradlew

      - name: Build APK
        run: |
          GRADLEW="$(find . -type f -name gradlew | head -1)"
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No se encontró gradlew. El proyecto Android no está completo o está dentro de una carpeta inesperada."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLEW")"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NationsBMSReader-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
