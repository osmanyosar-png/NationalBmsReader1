name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Find and extract project ZIP
        run: |
          ZIP="$(find . -maxdepth 3 -type f -iname 'NationsBMSReaderProject.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: NationsBMSReaderProject.zip was not found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f
            exit 1
          fi
          mkdir -p android-project
          unzip -o "$ZIP" -d android-project
          echo "ZIP extracted. Project files:"
          find android-project -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        run: |
          SETTINGS="$(find android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No settings.gradle found in extracted ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Gradle project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NationsBMSReader-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
